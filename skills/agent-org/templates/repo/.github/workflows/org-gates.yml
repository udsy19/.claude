# The org's landing gates, run on every pull request into {{MAIN_BRANCH}}. The same gates
# supervise.py runs before a LAND, so a human-opened PR is held to the same bar.
# Installed by the agent-org kit (init-repo.mjs); an existing file is never overwritten.
name: org-gates

on:
  pull_request:
    branches: [{{MAIN_BRANCH}}]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      ORG_MAIN_BRANCH: {{MAIN_BRANCH}}
    steps:
      # Full history and the PR head itself (not GitHub's synthetic merge commit), so the gates
      # grade merge-base(origin/{{MAIN_BRANCH}}, head)..head: exactly what the PR carries.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The judge comes from the base, not from the change it judges: a PR that rewrites a gate
      # would otherwise run its own rewritten gate on itself (audit A3). The PR's own copies of
      # these paths are graded as changes like any other file (they are protected paths).
      - name: gate code from the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:scripts/gates/plan-ownership.mjs" 2>/dev/null; then
            git checkout "origin/$BASE_REF" -- scripts/gates scripts/lib
          else
            echo "the base has no gate code yet (this PR installs the kit): its own gates run this once"
          fi
      - name: org board
        run: bash scripts/gates/org-board.sh
      # Run on their own as well, so a red ownership or sprawl verdict is its own failed step.
      # Exit 77 is a declared skip (nothing in the range), never a failure and never a pass.
      - name: plan ownership
        run: node scripts/gates/plan-ownership.mjs || [ $? -eq 77 ]
      - name: sprawl
        run: node scripts/gates/sprawl.mjs || [ $? -eq 77 ]
